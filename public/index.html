<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Lật Hình Cùng Nhau 💕</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="joinScreen" class="screen">
    <h1>Lật Hình Cùng Nhau 💕</h1>
	<input id="playerNameInput" type="text"
       placeholder="Nhập tên của bạn"
       maxlength="16" />
    <p class="subtitle">Nhập cùng một mã phòng để vào chơi chung nhé</p>

    <div class="mode-select">
      <p class="mode-label">Chọn chế độ chơi (người vào trước sẽ quyết định)</p>
      <div class="mode-options" id="joinModeOptions">
        <button class="mode-btn active" data-mode="tonghop">🎉<span>Tổng hợp</span></button>
        <button class="mode-btn" data-mode="hoathinh">🎭<span>Hoạt hình</span></button>
        <button class="mode-btn" data-mode="convat">🐾<span>Con vật</span></button>
        <button class="mode-btn" data-mode="hoaqua">🍎<span>Hoa quả</span></button>
      </div>
    </div>

    <div class="mode-select">
      <p class="mode-label">Chọn màn bắt đầu</p>
      <div class="mode-options level-options" id="joinLevelOptions">
        <button class="mode-btn level-btn active" data-level="0">1️⃣<span>20 thẻ</span></button>
        <button class="mode-btn level-btn" data-level="1">2️⃣<span>24 thẻ</span></button>
        <button class="mode-btn level-btn" data-level="2">3️⃣<span>30 thẻ</span></button>
        <button class="mode-btn level-btn" data-level="3">4️⃣<span>36 thẻ</span></button>
        <button class="mode-btn level-btn" data-level="4">5️⃣<span>42 thẻ</span></button>
        <button class="mode-btn level-btn" data-level="5">6️⃣<span>48 thẻ</span></button>
      </div>
    </div>

    <input id="roomInput" type="text" placeholder="Nhập mã phòng!" maxlength="12" autocapitalize="characters" />
    <button id="joinBtn">Vào phòng</button>
    <p id="statusText" class="status"></p>
  </div>

  <div id="gameScreen" class="screen hidden">
    <div class="topbar">
	  <div class="scoreboard">
  <div class="player-score">
    <span id="player1Name">Người chơi 1</span>
    <strong id="player1Score">0</strong>
  </div>

  <div class="player-score">
    <span id="player2Name">Người chơi 2</span>
    <strong id="player2Score">0</strong>
  </div>
</div>
      <span id="modeIndicator" class="mode-indicator"></span>
      <span id="levelIndicator" class="mode-indicator"></span>
      <span id="turnIndicator" class="turn-indicator">Đang chờ...</span>
      <div class="voice-controls">
        <button id="muteBtn" class="icon-btn" title="Tắt/bật mic">🎤</button>
        <button id="musicToggleBtn" class="icon-btn" title="Tắt/bật nhạc nền">🎵</button>
        <span id="voiceStatus" class="voice-status">Voice: đang kết nối...</span>
      </div>
    </div>

    <div id="board" class="board"></div>

    <div class="bottombar">
      <button id="changeModeBtn">🔀 Đổi chế độ</button>
      <button id="restartBtn">Chơi lại</button>
      <button id="leaveBtn" class="danger">Rời phòng</button>
    </div>
  </div>

  <audio id="remoteAudio" autoplay playsinline></audio>
  <button id="enableAudioBtn" class="hidden enable-audio-btn">🔊 Bấm để bật âm thanh</button>

  <button id="toggleLogBtn" class="toggle-log-btn">🐞 Log</button>
  <div id="debugLog" class="debug-log hidden"></div>
	<!-- Âm thanh game -->
  <audio id="bgm" src="sounds/bgm.mp3" loop></audio>
  <audio id="matchSound" src="sounds/matchSound.mp3"></audio>
  <audio id="flipSound" src="sounds/flip.mp3"></audio>
  <audio id="winSound" src="sounds/win.mp3"></audio>

  <div id="winOverlay" class="win-overlay hidden">
    <div class="win-box">
      <h2>🎉 Qua màn!</h2>
      <p id="levelText"></p>
    </div>
  </div>

  <div id="changeModeOverlay" class="win-overlay hidden">
    <div class="win-box">
      <h2>🔀 Đổi chế độ chơi</h2>
      <p class="mode-label">Chọn chủ đề</p>
      <div class="mode-options" id="inGameModeOptions">
        <button class="mode-btn" data-mode="tonghop">🎉<span>Tổng hợp</span></button>
        <button class="mode-btn" data-mode="hoathinh">🎭<span>Hoạt hình</span></button>
        <button class="mode-btn" data-mode="convat">🐾<span>Con vật</span></button>
        <button class="mode-btn" data-mode="hoaqua">🍎<span>Hoa quả</span></button>
      </div>
      <p class="mode-label" style="margin-top:14px;">Chọn màn bắt đầu</p>
      <div class="mode-options level-options" id="inGameLevelOptions">
        <button class="mode-btn level-btn" data-level="0">1️⃣<span>20 thẻ</span></button>
        <button class="mode-btn level-btn" data-level="1">2️⃣<span>24 thẻ</span></button>
        <button class="mode-btn level-btn" data-level="2">3️⃣<span>30 thẻ</span></button>
        <button class="mode-btn level-btn" data-level="3">4️⃣<span>36 thẻ</span></button>
        <button class="mode-btn level-btn" data-level="4">5️⃣<span>42 thẻ</span></button>
        <button class="mode-btn level-btn" data-level="5">6️⃣<span>48 thẻ</span></button>
      </div>
      <div style="display:flex; gap:10px; justify-content:center; margin-top:14px;">
        <button id="confirmChangeModeBtn">✅ Bắt đầu</button>
        <button id="closeChangeModeBtn" class="danger">Đóng</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
