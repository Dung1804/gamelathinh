<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Lật Hình Cùng Nhau 💕</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="joinScreen" class="screen">
    <h1>Lật Hình Cùng Nhau 💕</h1>
	<input id="playerNameInput" type="text"
       placeholder="Nhập tên của bạn"
       maxlength="16" />
    <p class="subtitle">Nhập cùng một mã phòng để vào chơi chung nhé</p>
    <input id="roomInput" type="text" placeholder="Nhập mã phòng (vd: YEU123)" maxlength="12" autocapitalize="characters" />
    <button id="joinBtn">Vào phòng</button>
    <p id="statusText" class="status"></p>
  </div>

  <div id="gameScreen" class="screen hidden">
    <div class="topbar">
	  <div class="scoreboard">
  <div class="player-score">
    <span id="player1Name">Người chơi 1</span>
    <strong id="player1Score">0</strong>
  </div>

  <div class="player-score">
    <span id="player2Name">Người chơi 2</span>
    <strong id="player2Score">0</strong>
  </div>
</div>
      <span id="turnIndicator" class="turn-indicator">Đang chờ...</span>
      <div class="voice-controls">
        <button id="muteBtn" class="icon-btn" title="Tắt/bật mic">🎤</button>
        <span id="voiceStatus" class="voice-status">Voice: đang kết nối...</span>
      </div>
    </div>

    <div id="board" class="board"></div>

    <div class="bottombar">
      <button id="restartBtn">Chơi lại</button>
      <button id="leaveBtn" class="danger">Rời phòng</button>
    </div>
  </div>

  <audio id="remoteAudio" autoplay playsinline></audio>
  <button id="enableAudioBtn" class="hidden enable-audio-btn">🔊 Bấm để bật âm thanh</button>

  <button id="toggleLogBtn" class="toggle-log-btn">🐞 Log</button>
  <div id="debugLog" class="debug-log hidden"></div>
	<!-- Âm thanh game -->
  <audio id="bgm" src="sounds/bgm.mp3" loop></audio>
  <audio id="matchSound" src="sounds/match.mp3"></audio>
  <audio id="flipSound" src="sounds/flip.mp3"></audio>
  <audio id="winSound" src="sounds/win.mp3"></audio>

  <div id="winOverlay" class="win-overlay hidden">
    <div class="win-box">
      <h2>🎉 Qua màn!</h2>
      <p id="levelText"></p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
